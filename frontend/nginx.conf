# nginx site for the SPA (WP-PLAT security headers). Identical in frontend/ and hr-frontend/.
#
# This file is an nginx *template*: the Dockerfile copies it to /etc/nginx/templates/default.conf.template and the
# official nginx image runs envsubst on start-up, replacing ${API_ORIGIN} with the environment variable of the same
# name (scheme://host[:port] of the backend, i.e. the origin of VITE_API_BASE_URL, e.g. https://api.example.com).
# Only defined environment variables are substituted, so nginx variables such as $uri are left alone.
# Used outside that image, replace ${API_ORIGIN} by hand.
#
# CSP: scripts and styles only from this origin. The build has no inline scripts: the theme is applied before first
# paint by the external /theme-init.js (public/), and Vite emits module scripts from /assets/. 'unsafe-inline' for
# styles covers the brand-token <style> the brand plugin injects and React style attributes. Fonts are self-hosted
# (@fontsource, bundled under /assets/). Images also as data:/blob: (QR codes, previews); XHR/fetch to this origin and
# the API. The SSO buttons navigate to the API origin (top-level navigation is not restricted by CSP).
#
# Caching: /assets/* are content-hashed (cached for a year, immutable); index.html and the other unhashed files
# (theme-init.js, ...) are revalidated on every load (ETag/Last-Modified), so a new deployment is picked up at once.

# Only a found asset (200/304) may be cached for a year; a 404 under /assets/ must not stick in caches.
map $status $rp_asset_cache_control {
    200     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # add_header in a location replaces the server-level list, so every location repeats the full set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Fingerprinted build assets can be cached for a long time. A missing asset is a 404, never index.html.
    location /assets/ {
        add_header Cache-Control $rp_asset_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked up (also reached by the SPA fallback below).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # SPA fallback: client-side routes (e.g. /jobs/12, /accept-invite?token=..., /sso/complete) serve index.html.
    # Unhashed public files (theme-init.js) are revalidated so a theme-script change is not stuck in browser caches.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
