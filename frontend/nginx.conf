# nginx site for the SPA (WP-PLAT security headers).
#
# This file is an nginx *template*: the Dockerfile copies it to /etc/nginx/templates/default.conf.template and the
# official nginx image runs envsubst on start-up, replacing ${API_ORIGIN} with the environment variable of the same
# name (scheme://host[:port] of the backend, i.e. the origin of VITE_API_BASE_URL, e.g. https://api.example.com).
# Only defined environment variables are substituted, so nginx variables such as $uri are left alone.
# Used outside that image, replace ${API_ORIGIN} by hand.
#
# CSP: scripts and styles only from this origin (Vite emits no inline scripts; 'unsafe-inline' for styles covers
# React style attributes), images also as data:/blob: (QR codes, previews), XHR/fetch to this origin and the API.
# The SSO buttons navigate to the API origin (top-level navigation is not restricted by CSP).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # add_header in a location replaces the server-level list, so every location repeats the full set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${API_ORIGIN}; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # SPA fallback: client-side routes (e.g. /jobs/12, /accept-invite?token=..., /sso/complete) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
