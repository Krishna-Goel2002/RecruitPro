name: CI

on:
  push:
    branches: [master, main, Kshitij, Kshitij-redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify, JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  backend-smoke:
    name: Backend smoke test on PostgreSQL 16 (dev profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Independent of the "backend" job (it packages with -DskipTests), so a failing test does not hide start-up errors.
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: recruitpro
          POSTGRES_USER: recruitpro
          POSTGRES_PASSWORD: recruitpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitpro -d recruitpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/recruitpro
      DB_USERNAME: recruitpro
      DB_PASSWORD: recruitpro
      # JWT_SECRET and APP_ENCRYPTION_KEY are generated per run (step "Fresh secrets"); none are stored in the repository.
      APP_SEED_DEMO: "true"
      BACKGROUND_JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fresh secrets for this run (masked in logs)
        run: |
          jwt="$(openssl rand -base64 48 | tr -d '\n')"
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$jwt"
          echo "::add-mask::$key"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "APP_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Package
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Start the jar (Flyway on PostgreSQL, Hibernate validate, demo seed)
        run: |
          mkdir -p "$RUNNER_TEMP/uploads"
          FILE_STORAGE_PATH="$RUNNER_TEMP/uploads" nohup java -jar target/recruitment-platform-*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/v1/health; then
              echo; echo "Backend is up"; exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"; cat "$RUNNER_TEMP/backend.log"; exit 1
      - name: Sign in with a seeded demo account
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -H 'X-RecruitPro-Portal: staff' \
            -d '{"email":"admin@acme.test","password":"ChangeMe-123!"}' > "$RUNNER_TEMP/login.json"
          grep -q '"accessToken"' "$RUNNER_TEMP/login.json"
          TOKEN=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['data']['accessToken'])" "$RUNNER_TEMP/login.json")
          curl -fsS http://localhost:8080/api/v1/admin/dashboard -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -fsS http://localhost:8080/api/v1/jobs -H "Authorization: Bearer $TOKEN" > /dev/null
      - name: Backend log
        if: always()
        run: cat "$RUNNER_TEMP/backend.log" || true

  ai-service:
    name: AI service (pytest + evaluation thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the Docker image's version (python:3.11-slim-bookworm)
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m eval.run --check

  agent-service:
    name: Agent service (pytest + evaluation thresholds + taxonomy sync)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the Docker image's version (python:3.12-slim-bookworm)
          cache: pip
          cache-dependency-path: agent-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python ../tools/sync_taxonomy.py --check
      - run: python -m pytest -q
      - run: python -m eval.run --check

  migrations:
    name: Flyway migrations and entity mappings on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pgserver psycopg2-binary tree-sitter tree-sitter-java
      - run: python -B tools/check_migrations_pg.py
      - run: python -B tools/check_entity_schema.py

  java-static:
    name: Java static check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tree-sitter tree-sitter-java
      - run: python -B tools/java_static_check.py backend/src

  repo-checks:
    name: Design sync, taxonomy sync, compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shared files are identical (src/design in both portals and the site; theme-init.js; portal nginx.conf, Dockerfile)
        run: python -B tools/check_design_sync.py
      - name: agent-service taxonomy matches ai-service
        run: python -B tools/sync_taxonomy.py --check
      - name: Compose files are valid (base, per-port profile, AI egress override)
        run: |
          python -B tools/generate_env.py
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile ports config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ai-egress.yml config --quiet

  frontends:
    name: Web app (${{ matrix.app }}) install, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, hr-frontend, site]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # the Docker build stage's version (node:22-alpine)
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Unit tests (Vitest) when the portal defines a "test" script; CI=true makes Vitest run once, without watch.
      - run: pnpm run --if-present test
      - run: pnpm build

  docker-stack:
    name: Docker images build and the compose stack starts healthy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Independent of the other jobs: the images compile without running tests.
    steps:
      - uses: actions/checkout@v4
      - name: Fresh secrets in a throw-away .env
        run: python3 -B tools/generate_env.py
      - name: Build every image and start the stack, gateway and per-port portals (waits for all health checks)
        run: docker compose --profile ports up --build --detach --wait --wait-timeout 600
      - name: Health and network isolation
        run: |
          set -eux
          docker compose ps
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://127.0.0.1:8100/health
          docker compose exec -T ai-service python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/health').read().decode())"
          # The AI service has no egress: an outbound request must fail.
          if docker compose exec -T ai-service python -c "import urllib.request as u; u.urlopen('https://example.com', timeout=5)"; then
            echo "ai-service reached the internet"; exit 1
          fi
          # LibreOffice is installed in the default image.
          docker compose exec -T ai-service sh -c 'command -v soffice'
          # The portals serve the SPA with the CSP naming the API origin.
          for port in 5173 5174; do
            curl -fsS -D - -o /dev/null "http://localhost:$port/jobs/1" | tee /dev/stderr | grep -i "content-security-policy:.*connect-src 'self' http://localhost:8080"
          done
          # The landing site is up, serves its theme script and has the strict CSP (no API origin: it calls nothing).
          curl -fsS -D - -o /dev/null http://localhost:5170/ | tee /dev/stderr | grep -i "content-security-policy:.*connect-src 'self';"
          curl -fsS http://localhost:5170/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5170/theme-init.js > /dev/null
          # The gateway: one origin for the landing site, both portals (deep links fall back to their index.html,
          # assets resolve under the base path) and the API, with connect-src 'self' only.
          G=http://localhost:8088
          curl -fsS $G/ | grep -q '<script src="/theme-init.js">'
          curl -fsS -D - -o /dev/null $G/ | tee /dev/stderr | grep -i "content-security-policy:.*form-action 'none'"
          for app in candidate hr; do
            curl -fsS -D - -o /dev/null "$G/$app/" | grep -i "content-security-policy:.*connect-src 'self';"
            curl -fsS "$G/$app/" > "$RUNNER_TEMP/$app.html"
            grep -q "src=\"/$app/theme-init.js\"" "$RUNNER_TEMP/$app.html"
            for asset in $(grep -o "/$app/assets/[^\"]*" "$RUNNER_TEMP/$app.html"); do curl -fsS -o /dev/null "$G$asset"; done
            curl -fsS -o /dev/null -w '%{http_code}\n' "$G/$app" | grep -q 301
          done
          curl -fsS "$G/hr/jobs/1" | grep -q '/hr/assets/'
          curl -fsS "$G/candidate/verification" | grep -q '/candidate/assets/'
          curl -fsS "$G/candidate/reference/not-a-real-token" | grep -q '/candidate/assets/'
          test "$(curl -s -o /dev/null -w '%{http_code}' $G/hr/assets/missing.js)" = 404
          curl -fsS $G/api/v1/health
          # The per-port portals still work (profile "ports").
          curl -fsS http://localhost:5173/ | grep -q 'src="/assets/'
          # The backend (non-root) can write to the uploads volume.
          docker compose exec -T backend sh -c 'touch /data/uploads/.ci-write-test && rm /data/uploads/.ci-write-test'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose --profile ports down -v
