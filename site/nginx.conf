# nginx site for the public landing page (static; no API calls, no forms).
#
# CSP: everything from this origin only. No inline scripts (the theme is applied before first paint by the external
# /theme-init.js), fonts are self-hosted (@fontsource, bundled under /assets/). 'unsafe-inline' for styles covers the
# brand-token <style> the brand plugin injects and React style attributes (the same allowance as the portals).
# connect-src 'self' and form-action 'none': the page fetches nothing and posts nothing. Links to the portals are
# top-level navigations, which the CSP does not restrict.
#
# Caching: /assets/* are content-hashed (cached for a year, immutable); index.html and the other unhashed files
# (theme-init.js) are revalidated on every load, so a new deployment is picked up at once.

map $status $rp_asset_cache_control {
    200     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # add_header in a location replaces the server-level list, so every location repeats the full set.
    location /assets/ {
        add_header Cache-Control $rp_asset_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # One page: every other path serves index.html (anchors such as /#faq work; unknown paths land on the page).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
