# RecruitPro local stack: `docker compose up --build`
#   Candidate portal  http://localhost:5173
#   HR portal         http://localhost:5174
#   Landing site      http://localhost:5170  (static; links to both portals)
#   Backend API       http://localhost:8080/api/v1  (Swagger UI: /swagger-ui.html)
#   Agent service     http://localhost:8100/health  (bound to 127.0.0.1)
#   Mailpit (email)   http://localhost:8025         (bound to 127.0.0.1; SMTP 1025)
#   AI service        not published (no-egress network); check it with
#                     docker compose exec ai-service python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/health').read().decode())"
#   PostgreSQL        not published; docker compose exec postgres psql -U recruitpro -d recruitpro
# Secrets have NO defaults here: run `python tools/generate_env.py` (or `.\tools\generate-env.ps1`) once to create a
# git-ignored .env with fresh random values. Compose stops with a clear message when one is missing.
#
# Networks (least privilege; "internal: true" = no route out of Docker and no published ports):
#   internal      postgres, mailpit, ai-service, backend   - the backend's private services
#   agent         backend, agent-service                   - the agent cannot reach postgres or the AI service
#   egress        backend                                  - SMTP, GitHub OAuth, OIDC providers; publishes 8080
#   agent-egress  agent-service                            - candidate URLs, GitHub/GitLab, badge issuers; publishes 8100
#   edge          candidate-portal, hr-portal, site, mailpit - published ports only
# The AI service has no egress. For LLM_PROVIDER=anthropic|openai_compatible add the override:
#   docker compose -f docker-compose.yml -f docker-compose.ai-egress.yml up -d
name: recruitpro

services:
  postgres:
    # Pinned (pgvector 0.8.7 on PostgreSQL 16, the variant the floating "pg16" tag pointed at). The pgvector extension
    # is not used by any migration; this is plain PostgreSQL 16 for the app.
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: recruitpro
      POSTGRES_USER: recruitpro
      POSTGRES_PASSWORD: recruitpro
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitpro -d recruitpro"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP (for a backend run outside Docker)
    networks: [internal, edge]

  ai-service:
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN Missing - run tools/generate_env.py or tools/generate-env.ps1 to create .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      # Only read when LLM_PROVIDER is anthropic or openai_compatible (a provider without LLM_MODEL refuses to start).
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # HR assistant planner (none = offline rules; gemini | groq | anthropic | openai_compatible need
      # ASSISTANT_LLM_MODEL - no default - and the docker-compose.ai-egress.yml override).
      ASSISTANT_LLM_PROVIDER: ${ASSISTANT_LLM_PROVIDER:-none}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      ASSISTANT_LLM_TIMEOUT_SECONDS: ${ASSISTANT_LLM_TIMEOUT_SECONDS:-20}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      # OCR for scanned resumes (RapidOCR is installed in the image; off unless set to true).
      OCR_ENABLED: ${OCR_ENABLED:-false}
    # No host port: the AI service is only on the internal network (no egress, as designed).
    networks: [internal]

  agent-service:
    build: ./agent-service
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN Missing - run tools/generate_env.py or tools/generate-env.ps1 to create .env}
      LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-none}
      AGENT_DEMO_FIXTURES: ${AGENT_DEMO_FIXTURES:-true}
      # Only read when AGENT_LLM_PROVIDER is not none (same model/keys as the AI service).
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional server token for GitHub API rate limits on real (non-demo) accounts.
      GITHUB_TOKEN: ${AGENT_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8100:8100"
    networks: [agent, agent-egress]

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      # Both Python images have a HEALTHCHECK on /health; waiting for it avoids "AI service DOWN" on the first start.
      ai-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/recruitpro
      DB_USERNAME: recruitpro
      DB_PASSWORD: recruitpro
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET Missing - run tools/generate_env.py or tools/generate-env.ps1 to create .env}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN Missing - run tools/generate_env.py or tools/generate-env.ps1 to create .env}
      # Verification agent service (WP-VBE); the same AGENT_SERVICE_TOKEN as the agent-service entry above.
      AGENT_SERVICE_URL: http://agent-service:8100
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN Missing - run tools/generate_env.py or tools/generate-env.ps1 to create .env}
      # AES-256-GCM key for connector tokens and MFA secrets: exactly 32 random bytes, Base64 (from .env).
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY Missing - run tools/generate_env.py or tools/generate-env.ps1 to create .env}
      # GitHub OAuth app for "Connect with GitHub" (optional; empty = username + bio code only).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8080/api/v1/verification/oauth/github/callback}
      # Staff single sign-on (optional; a provider is offered only when its client id and secret are set).
      # Register <SSO_REDIRECT_BASE_URL>/api/v1/auth/sso/<google|microsoft|oidc>/callback with the identity provider.
      SSO_REDIRECT_BASE_URL: ${SSO_REDIRECT_BASE_URL:-http://localhost:8080}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET:-}
      SSO_MICROSOFT_CLIENT_ID: ${SSO_MICROSOFT_CLIENT_ID:-}
      SSO_MICROSOFT_CLIENT_SECRET: ${SSO_MICROSOFT_CLIENT_SECRET:-}
      SSO_MICROSOFT_TENANT_ID: ${SSO_MICROSOFT_TENANT_ID:-organizations}
      SSO_OIDC_NAME: ${SSO_OIDC_NAME:-Company SSO}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_ISSUER: ${SSO_OIDC_ISSUER:-}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      CANDIDATE_PORTAL_URL: http://localhost:5173
      HR_PORTAL_URL: http://localhost:5174
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-ChangeMe-123!}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FILE_STORAGE_PATH: /data/uploads
    ports:
      - "8080:8080"
    networks: [internal, agent, egress]
    volumes:
      - resume-uploads:/data/uploads

  candidate-portal:
    build:
      context: ./frontend
      args:
        # The API URL is compiled into the bundle; API_ORIGIN (its scheme://host:port) goes into the nginx CSP
        # connect-src. Change both together.
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        API_ORIGIN: http://localhost:8080
    environment:
      API_ORIGIN: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks: [edge]

  hr-portal:
    build:
      context: ./hr-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        API_ORIGIN: http://localhost:8080
    environment:
      API_ORIGIN: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5174:80"
    networks: [edge]

  # Public landing page (site/): static, calls no API. The portal URLs are compiled in; change them together with
  # the published portal addresses.
  site:
    build:
      context: ./site
      args:
        VITE_CANDIDATE_URL: http://localhost:5173
        VITE_HR_URL: http://localhost:5174
    ports:
      - "5170:80"
    networks: [edge]
    # Same probe as the image's HEALTHCHECK, stated here so `docker compose ps` shows it without reading the Dockerfile.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  internal:
    internal: true
  agent:
    internal: true
  egress: {}
  agent-egress: {}
  edge: {}

volumes:
  postgres-data:
  resume-uploads:
