# ============================================
# Test Environment Configuration
# Profile: test
# ============================================

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:recruitment_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  ai-service:
    queue-enabled: false
  file-storage:
    upload-dir: ./target/test-uploads
  jwt:
    secret: test-signing-key-for-recruitpro-tests-minimum-32-bytes

logging:
  level:
    root: INFO
    com.recruitpro: INFO
    org.flywaydb: INFO
