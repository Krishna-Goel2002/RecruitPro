# ============================================
# Test Environment Configuration
# Profile: test — Flyway runs the PostgreSQL migrations on H2 in PostgreSQL mode.
# ddl-auto is "none" because H2 reports TEXT as CLOB, which Hibernate's validator rejects;
# schema/entity agreement is validated against real PostgreSQL by the CI smoke job instead.
# ============================================

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:recruitpro;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: test-signing-key-for-recruitpro-tests-minimum-32-bytes
  auth:
    cookie-secure: false
    expose-refresh-token-in-body: true
    require-verified-email-to-apply: false
  rate-limit:
    enabled: false
  background-jobs:
    enabled: false
  jobs:
    deadline-closer:
      enabled: false
  work-samples:
    expiry-sweep:
      enabled: false
  notifications:
    sender-enabled: false
  mail:
    enabled: false
  invitations:
    expose-link: true
  frontend:
    candidate-url: http://localhost:5173
    hr-url: http://localhost:5174
  seed:
    demo: false
  bootstrap:
    org-name: ""
    admin-email: ""
    admin-password: ""
  file-storage:
    upload-dir: ./target/test-uploads

logging:
  level:
    root: INFO
    com.recruitpro: INFO
    org.flywaydb: INFO
