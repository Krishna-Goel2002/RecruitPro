# ============================================
# AI-Powered Recruitment Platform
# Spring Boot Application Configuration
# ============================================

spring:
  application:
    name: recruitment-platform

  # ---- Database Configuration ----
  datasource:
    url: jdbc:mysql://localhost:3306/recruitment_platform_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: RecruitProHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # ---- Jackson (JSON) ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

  # ---- File Upload ----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ---- Mail (disabled by default, configure in Phase 9+) ----
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ---- Server ----
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ---- JWT Configuration ----
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyThatShouldBeReplacedInProductionWithAtLeast256Bits}
    access-token-expiry-ms: 86400000     # 24 hours
    refresh-token-expiry-ms: 604800000   # 7 days
    issuer: recruitment-platform

  # ---- AI Service Configuration ----
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 30000
    retry-attempts: 3

  # ---- File Storage ----
  file-storage:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    allowed-types: pdf,doc,docx
    max-size-mb: 10

  # ---- CORS ----
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# ---- API Documentation (SpringDoc / Swagger) ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ---- Logging ----
logging:
  level:
    root: INFO
    com.recruitpro: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
