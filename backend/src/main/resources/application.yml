# ============================================
# AI-Powered Recruitment Platform
# Spring Boot Core Application Configuration
# ============================================

spring:
  application:
    name: recruitment-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Flyway Migration ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  # ---- Jackson (JSON Serialization) ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

  # ---- Servlet / Multipart ----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # ---- Mail (Disabled by default, configured per environment) ----
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ---- Server ----
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# ---- Application Custom Settings ----
app:
  dev-provisioning:
    hr-manager:
      enabled: ${HR_MANAGER_PROVISIONING_ENABLED:false}

  jwt:
    access-token-expiry-ms: 86400000     # 24 hours
    refresh-token-expiry-ms: 604800000   # 7 days
    issuer: recruitment-platform

  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 30000
    service-token: ${AI_SERVICE_TOKEN:}
    poll-interval-ms: 2000
    queue-enabled: ${AI_RESUME_QUEUE_ENABLED:true}

  file-storage:
    upload-dir: ${FILE_STORAGE_PATH:./uploads}
    allowed-types: pdf,doc,docx
    max-size-mb: 10

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

# ---- OpenAPI / Swagger UI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# ---- Logging ----
logging:
  level:
    root: INFO
    com.recruitpro: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
