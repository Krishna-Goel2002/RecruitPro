# ============================================
# AI-Powered Recruitment Platform
# Spring Boot Core Application Configuration
# Profile-specific files: application-dev.yml, application-prod.yml, application-test.yml
# ============================================

spring:
  application:
    name: recruitment-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Flyway Migration (PostgreSQL 16; H2 MODE=PostgreSQL in tests) ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ---- JPA / Hibernate (D15: all timestamps are UTC) ----
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ---- Jackson (JSON Serialization) ----
  # LocalDateTime values are written as UTC with a trailing 'Z' by common.time.UtcTimeModule.
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ---- Scheduler for the background job worker and notification sender ----
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: recruitpro-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 10s

  # ---- Servlet / Multipart ----
  servlet:
    multipart:
      # Resumes keep their own 10 MB check (app.file-storage.max-size-mb); work-sample files may be 20 MB each, three
      # per submission (WP-PLAT), so the request limit allows 3 x 20 MB plus form fields.
      max-file-size: 20MB
      max-request-size: 62MB

  # ---- Mail (Mailpit in development; app.mail.enabled switches real sending on) ----
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ---- Server ----
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# ---- Application Custom Settings ----
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry-ms: 900000         # 15 minutes (D11)
    refresh-token-expiry-ms: 1209600000    # 14 days (sliding: each rotation starts a new 14 days)
    # R1-U2: absolute session lifetime. A refresh family (one sign-in) ends this many days after the sign-in,
    # however often it is rotated; the user signs in again.
    refresh-absolute-lifetime-days: ${JWT_REFRESH_ABSOLUTE_LIFETIME_DAYS:30}
    issuer: recruitment-platform

  auth:
    # Refresh token cookie (HttpOnly, SameSite=Strict, Path=/api/v1/auth): rp_refresh_candidate / rp_refresh_staff,
    # chosen by the X-RecruitPro-Portal request header; rp_refresh when the header is absent.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    # Only for API clients and automated tests; browsers always use the cookie.
    expose-refresh-token-in-body: ${AUTH_EXPOSE_REFRESH_TOKEN_IN_BODY:false}
    refresh-grace-seconds: 30
    require-verified-email-to-apply: ${AUTH_REQUIRE_VERIFIED_EMAIL_TO_APPLY:false}
    email-verification-ttl-hours: 24
    password-reset-ttl-minutes: 60
    lockout:
      max-attempts: 5
      duration-minutes: 15

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # memory (one instance) or database (shared rate_limit_buckets table, several instances) - WP-PLAT
    store: ${RATE_LIMIT_STORE:memory}

  # Encrypts TOTP secrets, SSO PKCE verifiers and connector tokens (AES-256-GCM, 32 random bytes, Base64:
  # openssl rand -base64 32). Without it MFA, SSO and OAuth connectors are unavailable (503).
  encryption:
    key: ${APP_ENCRYPTION_KEY:}

  # Staff TOTP MFA (WP-PLAT): issuer shown in authenticator apps.
  mfa:
    issuer: ${MFA_ISSUER:RecruitPro}

  # Staff OIDC single sign-on (WP-PLAT). A provider is offered only with client id and secret. Endpoints are read
  # from <issuer>/.well-known/openid-configuration unless authorization-uri, token-uri and jwks-uri are all set.
  # Register the redirect URI <redirect-base-url>/api/v1/auth/sso/<id>/callback with the provider.
  sso:
    redirect-base-url: ${SSO_REDIRECT_BASE_URL:http://localhost:8080}
    state-ttl-minutes: 10
    clock-skew-seconds: 60
    max-token-age-seconds: 600
    providers:
      google:
        name: Google
        client-id: ${SSO_GOOGLE_CLIENT_ID:}
        client-secret: ${SSO_GOOGLE_CLIENT_SECRET:}
        issuer: https://accounts.google.com
        scopes: openid email profile
      microsoft:
        name: Microsoft
        client-id: ${SSO_MICROSOFT_CLIENT_ID:}
        client-secret: ${SSO_MICROSOFT_CLIENT_SECRET:}
        # Use your tenant id (single-tenant app); "organizations" also works (issuer validated with the token's tid).
        issuer: https://login.microsoftonline.com/${SSO_MICROSOFT_TENANT_ID:organizations}/v2.0
        scopes: openid email profile
      oidc:
        name: ${SSO_OIDC_NAME:Company SSO}
        client-id: ${SSO_OIDC_CLIENT_ID:}
        client-secret: ${SSO_OIDC_CLIENT_SECRET:}
        issuer: ${SSO_OIDC_ISSUER:}
        scopes: ${SSO_OIDC_SCOPES:openid email profile}

  # /actuator/prometheus without authentication (keep it off the public network); otherwise ADMIN only.
  metrics:
    public: ${METRICS_PUBLIC:false}

  # Id of this backend instance in notification row claims (default: host name + random suffix).
  instance-id: ${APP_INSTANCE_ID:}

  organizations:
    self-signup-enabled: ${ORG_SELF_SIGNUP_ENABLED:true}

  invitations:
    ttl-days: 7
    # When true, POST /api/v1/admin/invitations returns the invitation link (development only).
    expose-link: ${INVITATIONS_EXPOSE_LINK:false}

  frontend:
    candidate-url: ${CANDIDATE_PORTAL_URL:http://localhost:5173}
    hr-url: ${HR_PORTAL_URL:http://localhost:5174}

  # First organisation + administrator, created once when no organisation exists (any profile).
  bootstrap:
    org-name: ${BOOTSTRAP_ORG_NAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Organisation}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Admin}

  # Demo data (organisation "Acme Labs", demo accounts, two published jobs). Never enabled in prod.
  seed:
    demo: ${APP_SEED_DEMO:false}
    password: ${APP_SEED_PASSWORD:ChangeMe-123!}

  background-jobs:
    enabled: ${BACKGROUND_JOBS_ENABLED:true}
    poll-interval-ms: 2000
    batch-size: 5
    max-attempts: 5
    stale-after-minutes: 10

  # Closes PUBLISHED jobs whose application deadline has passed (closed_reason DEADLINE_PASSED).
  jobs:
    deadline-closer:
      enabled: ${JOB_DEADLINE_CLOSER_ENABLED:true}
      interval-ms: 60000
      initial-delay-ms: 30000

  # Marks work-sample assignments EXPIRED (time limit + 5-minute grace passed, or not started by the due date).
  work-samples:
    expiry-sweep:
      enabled: ${WORK_SAMPLE_EXPIRY_SWEEP_ENABLED:true}
      interval-ms: 60000
      initial-delay-ms: 45000
    # Submission attachments (WP-PLAT): pdf, zip, docx, pptx, png, jpg; at most 3 per assignment.
    files:
      max-size-mb: 20

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:RecruitPro <no-reply@recruitpro.local>}

  notifications:
    sender-enabled: ${NOTIFICATIONS_SENDER_ENABLED:true}
    poll-interval-ms: 5000
    max-attempts: 5
    # Log full links (with one-time tokens) when mail is disabled. Development only.
    log-links: ${NOTIFICATIONS_LOG_LINKS:false}

  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 30000
    # R2-H03: resume parsing has its own read time-out (LibreOffice/OCR/LLM plus queueing); never below timeout-ms.
    parse-timeout-ms: ${AI_SERVICE_PARSE_TIMEOUT_MS:120000}
    health-timeout-ms: 2000
    service-token: ${AI_SERVICE_TOKEN:}

  # HR assistant orchestrator (docs/plan/ASSISTANT_PLAN.md, AS-BE): the backend runs tools as the signed-in user and
  # calls the ai-service planner (POST /api/v1/assistant/step) in a loop. The planner's provider is configured in the
  # ai-service (ASSISTANT_LLM_PROVIDER, default offline); organisations allow the external model with the
  # assistantExternalModel setting (default false).
  assistant:
    step-timeout-ms: ${ASSISTANT_STEP_TIMEOUT_MS:25000}   # read time-out of one planner call
    max-steps: 6                                         # planner calls per user message
    message-budget-ms: 60000                             # wall-clock limit of one user message (all steps)
    max-messages-per-hour: ${ASSISTANT_MAX_MESSAGES_PER_HOUR:30}  # per user; 429 with Retry-After above; 0 = off
    action-ttl-minutes: 30                               # proposed actions expire after this
    history-messages: 20                                 # last N messages sent to the planner (de-identified)

  # Verification agent service (plan v2 section 4, WP-AG): fetches evidence and drafts verdicts; the backend stores
  # them. Called only by the VERIFY_SOURCE / VERIFY_REFERENCE jobs and the candidate's ownership check.
  agent-service:
    base-url: ${AGENT_SERVICE_URL:http://localhost:8100}
    service-token: ${AGENT_SERVICE_TOKEN:}
    timeout-ms: 60000           # the agent's own deadline is 50 s
    connect-timeout-ms: 5000
    health-timeout-ms: 2000

  # Claim Ledger and verification (plan v2 sections 3 and 5, WP-VBE).
  verification:
    # Version of the consent text the candidate accepts when connecting a source (stored per source).
    consent-version: ${VERIFICATION_CONSENT_VERSION:2026-11-v1}
    # Evidence snapshots and uploaded verification documents.
    storage-dir: ${VERIFICATION_STORAGE_PATH:${FILE_STORAGE_PATH:./uploads}/verification}
    # Runs per candidate in 24 hours (429 above).
    max-runs-per-day: 10
    # GitHub OAuth app (scope read:user). Register <backend>/api/v1/verification/oauth/github/callback as the
    # callback URL. Needs app.encryption.key as well; otherwise GET .../oauth/github/start answers 503.
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:}
    # Marks SENT reference requests past their 14-day expiry EXPIRED and deletes stale OAuth states.
    reference-expiry:
      enabled: ${VERIFICATION_REFERENCE_EXPIRY_ENABLED:true}
      interval-ms: 900000
      initial-delay-ms: 60000

  # Data-retention purge (WP-OPS, retention/RetentionPurgeService): deletes used/expired tokens and login states,
  # finished background jobs, delivered notifications, old rate-limit windows and audit events; anonymises old
  # expired/cancelled/declined reference requests. Periods in days; each batch is its own transaction.
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 30 3 * * *}       # 03:30 UTC daily; "-" disables the schedule
    batch-size: 500
    max-batches-per-table: 200                  # per run; the rest follows on the next run
    token-days: 30                              # user_tokens and refresh_tokens after use, revocation or expiry
    job-done-days: 30                           # background_jobs DONE
    job-failed-days: 90                         # background_jobs FAILED / DEAD
    notification-days: 180                      # e-mails SENT/SKIPPED and read in-app messages
    state-days: 1                               # sso_login_states, verification_oauth_states after use or expiry
    rate-limit-days: 1                          # rate_limit_buckets windows
    reference-days: 365                         # EXPIRED/CANCELLED/DECLINED reference requests: referee PII removed
    audit-days: ${RETENTION_AUDIT_DAYS:730}     # audit_events; 0 = keep forever
    assistant-conversation-days: 180            # HR assistant conversations (+ messages, actions) since last activity

  file-storage:
    upload-dir: ${FILE_STORAGE_PATH:./uploads}
    allowed-types: pdf,doc,docx
    max-size-mb: 10
    # Work-sample submission files, separate from resumes (WP-PLAT).
    work-sample-dir: ${WORK_SAMPLE_STORAGE_PATH:${app.file-storage.upload-dir}/work-samples}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never

# ---- OpenAPI / Swagger UI (disabled in prod, L5) ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ---- Logging ----
logging:
  level:
    root: INFO
    com.recruitpro: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO
  pattern:
    # requestId: MDC key set by observability.RequestIdFilter and per background job (WP-PLAT)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
