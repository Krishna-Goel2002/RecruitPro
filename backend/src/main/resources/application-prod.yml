# ============================================
# Production Environment Configuration
# Profile: prod (PostgreSQL 16)
# ============================================

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RecruitProProdHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: true
    expose-refresh-token-in-body: false
    require-verified-email-to-apply: ${AUTH_REQUIRE_VERIFIED_EMAIL_TO_APPLY:true}
  invitations:
    expose-link: false
  mail:
    enabled: ${MAIL_ENABLED:true}
  notifications:
    log-links: false
  seed:
    demo: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# L5: no public API documentation in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  # WP-PLAT: one JSON (Elastic Common Schema) object per line; the MDC requestId is included.
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.recruitpro: INFO
    org.springframework: WARN
