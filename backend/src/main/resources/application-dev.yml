# ============================================
# Development Environment Configuration
# Profile: dev (PostgreSQL 16, e.g. the docker compose "postgres" service)
# ============================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruitpro}
    username: ${DB_USERNAME:recruitpro}
    password: ${DB_PASSWORD:recruitpro}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RecruitProDevHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

app:
  jwt:
    # Required. Use a random value of at least 32 bytes (docker compose supplies a development value).
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    require-verified-email-to-apply: ${AUTH_REQUIRE_VERIFIED_EMAIL_TO_APPLY:false}
  invitations:
    expose-link: ${INVITATIONS_EXPOSE_LINK:true}
  notifications:
    log-links: ${NOTIFICATIONS_LOG_LINKS:true}

logging:
  level:
    com.recruitpro: DEBUG
