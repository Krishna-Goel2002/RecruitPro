# RecruitPro gateway: the whole product on ONE origin (docker compose service `gateway`, http://localhost:8088).
#
#   /             landing site      /srv/www/site/       (static)
#   /candidate/   candidate portal  /srv/www/candidate/  (SPA: unknown paths serve its index.html)
#   /hr/          HR portal         /srv/www/hr/         (SPA)
#   /api/         backend:8080      proxied with Host and X-Forwarded-* headers
#
# Non-root friendly: listens on 8080 (the compose file publishes it on ${GATEWAY_PORT:-8088}), pid and temp files
# under /tmp, logs to stdout/stderr; runs as the image's `nginx` user.
#
# Caching: /…/assets/* are content-hashed (a year, immutable; a 404 is never cached); index.html and the unhashed
# theme-init.js are revalidated on every load, so a rebuilt image is picked up at once.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Only a found asset (200/304) may be cached for a year; a 404 under assets/ must not stick in caches.
    map $status $rp_asset_cache_control {
        200     "public, max-age=31536000, immutable";
        304     "public, max-age=31536000, immutable";
        default "no-store";
    }

    # Docker's embedded DNS. The backend's address is looked up per request (variable in proxy_pass), so the gateway
    # starts before the backend and keeps working after `docker compose up -d backend` gives it a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        # Redirects keep the browser's host and port (relative Location), never the container's 8080.
        absolute_redirect off;

        # ------------------------------------------------------------------------------------------- API
        # Same origin as the pages: no CORS. Resume and work-sample uploads (the backend allows 62 MB per request)
        # and the HR assistant's slow model answers need the larger limits.
        location /api/ {
            set $rp_backend http://backend:8080;
            proxy_pass $rp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            client_max_body_size 64m;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # ------------------------------------------------------------------------------------------- candidate portal
        location = /candidate {
            return 301 /candidate/;
        }
        location /candidate/assets/ {
            root /srv/www;
            include /etc/nginx/snippets/portal-headers.conf;
            add_header Cache-Control $rp_asset_cache_control always;
            try_files $uri =404;
        }
        # Client-side routes (/candidate/jobs/12, /candidate/reference/<token>, ...) serve the portal's index.html.
        location /candidate/ {
            root /srv/www;
            include /etc/nginx/snippets/portal-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /candidate/index.html;
        }

        # ------------------------------------------------------------------------------------------- HR portal
        location = /hr {
            return 301 /hr/;
        }
        location /hr/assets/ {
            root /srv/www;
            include /etc/nginx/snippets/portal-headers.conf;
            add_header Cache-Control $rp_asset_cache_control always;
            try_files $uri =404;
        }
        # Client-side routes (/hr/jobs/1, /hr/accept-invite?token=..., /hr/sso/complete, ...) serve index.html.
        location /hr/ {
            root /srv/www;
            include /etc/nginx/snippets/portal-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /hr/index.html;
        }

        # ------------------------------------------------------------------------------------------- landing site
        location /assets/ {
            root /srv/www/site;
            include /etc/nginx/snippets/site-headers.conf;
            add_header Cache-Control $rp_asset_cache_control always;
            try_files $uri =404;
        }
        # Every other path: the landing page answers "/" and shows its own "page not found" view for the rest.
        location / {
            root /srv/www/site;
            include /etc/nginx/snippets/site-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
