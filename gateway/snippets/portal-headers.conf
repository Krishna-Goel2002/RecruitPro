# Security headers for the two portals (/candidate/, /hr/). One origin for pages and API, so connect-src and
# form-action are 'self' only (the per-port images name the API origin as well). Scripts and styles from this origin;
# no inline scripts (theme-init.js is an external file); 'unsafe-inline' styles cover the brand-token <style> and React
# style attributes; images also data:/blob: (QR codes, previews); fonts are self-hosted. The SSO buttons and GitHub
# connect are top-level navigations (not restricted by the CSP).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
